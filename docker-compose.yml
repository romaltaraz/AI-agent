# Runs the whole app with one command:  docker compose up --build
# You only fill in Backend/.env (copy it from Backend/.env.example).
# The DB_* values below override the ones in that file, because inside Docker
# the database is the "mysql" service, not localhost.
# Port 3307 on your computer is also what a manually-run backend uses (DB_PORT=3307).
# Password: "change_me" must match DB_PASSWORD in Backend/.env for the manual backend.
# To change it, change it in this file everywhere: MYSQL_ROOT_PASSWORD, the healthcheck,
# and the backend DB_PASSWORD.

services:
  mysql:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: change_me # local-only; must match DB_PASSWORD in Backend/.env (see top)
    ports:
      - "3307:3306" # 3307 on your computer, a port other than MySQL's usual 3306, so it rarely clashes with a MySQL already installed
    volumes:
      - mysql_data:/var/lib/mysql
      # Loaded automatically, but ONLY on the very first start (while the volume is empty)
      - ./Database/ai_chat_export.sql:/docker-entrypoint-initdb.d/ai_chat_export.sql:ro
    healthcheck:
      # password below (-pchange_me) must match MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pchange_me --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Optional: view the database in the browser at http://localhost:8080 (root / change_me)
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: change_me # must match MYSQL_ROOT_PASSWORD
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./Backend
    env_file: Backend/.env
    environment:
      # These DB_* values override Backend/.env (inside Docker the DB is mysql:3306).
      # DB_PASSWORD must equal MYSQL_ROOT_PASSWORD above.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: change_me
      DB_NAME: ai_chat
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./Frontend
    environment:
      # The browser (not the container) calls the API, so this is the published backend port
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
